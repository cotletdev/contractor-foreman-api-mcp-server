[project]
name = "contractor-foreman-api-mcp"
version = "1.0.1"
description = "Self-hosted Contractor Foreman API and MCP server on your own Chrome session. Noncommercial use (PolyForm Noncommercial 1.0.0)."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Communications"]
requires-python = ">=3.11"
authors = [{ name = "Cotlet", email = "contact@cotlet.dev" }]
keywords = ["contractor foreman", "contractor foreman api", "contractor foreman mcp", "construction management", "mcp server", "claude", "chatgpt", "cursor"]
dependencies = [
    "curl_cffi>=0.13,<0.17",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.12,<2",
    "jsonschema>=4.20",
    "websockets>=13",
]

[project.urls]
Homepage = "https://cotlet.dev/integrations/contractor-foreman-api-mcp-server"
Source = "https://github.com/cotletdev/contractor-foreman-api-mcp-server"

[project.scripts]
contractor-foreman-mcp = "contractor_foreman_api_mcp.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contractor_foreman_api_mcp"]

[tool.ruff]
line-length = 120
target-version = "py311"
